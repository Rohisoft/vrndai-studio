services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    # .env (COMFYUI_BASE_URL, COMFYUI_MOCK, APP_PASSWORD, etc.) is loaded by
    # the app itself at startup from the bind-mounted repo root -- see
    # apps/api/src/index.ts's dotenv.config() call -- so it doesn't need to
    # be duplicated here via env_file.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      # Inside Compose's network, the api is only reachable by its service
      # name -- 127.0.0.1 from inside this container means "this container".
      - VITE_API_PROXY_TARGET=http://api:3001
    depends_on:
      - api

volumes:
  api_node_modules:
  web_node_modules:
